name: Bootstrap Gradle Wrapper

on:
  push:
    paths:
      - '.github/workflows/bootstrap-gradle-wrapper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Generate Gradle wrapper
        working-directory: android/MemoBrainShare
        run: gradle --no-daemon wrapper --gradle-version 9.5.1 --distribution-type bin

      - name: Commit wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            android/MemoBrainShare/gradlew \
            android/MemoBrainShare/gradlew.bat \
            android/MemoBrainShare/gradle/wrapper/gradle-wrapper.jar \
            android/MemoBrainShare/gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Gradle wrapper already up to date."
          else
            git commit -m "chore: add Gradle 9.5.1 wrapper"
            git push
          fi
