name: Update v1 Builder Labels

on:
  push:
    paths:
      - '.github/workflows/bump-v1-builder.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update builder version labels
        run: |
          sed -i 's/MemoBrain-v0\.4\.1-debug\.apk/MemoBrain-v1.0.0-debug.apk/g' android/MemoBrainShare/Build-MemoBrainApk.ps1
          sed -i 's/MemoBrain APK Builder v0\.4\.1/MemoBrain APK Builder v1.0.0/g' android/MemoBrainShare/Build-MemoBrainApk.ps1

      - name: Commit builder update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/MemoBrainShare/Build-MemoBrainApk.ps1
          if git diff --cached --quiet; then
            echo "Builder already uses v1.0.0 labels."
          else
            git commit -m "release: update builder output names to v1.0.0"
            git push
          fi
