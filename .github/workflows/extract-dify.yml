name: Extract Dify DSL

on:
  push:
    paths:
      - 'dify/bootstrap/**'
      - '.github/workflows/extract-dify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild original Dify package from bootstrap parts
        run: |
          cat \
            dify/bootstrap/MemoBrain-v0.2.2-DifyPatch.zip.b64.part1 \
            dify/bootstrap/MemoBrain-v0.2.2-DifyPatch.zip.b64.part2 \
            dify/bootstrap/MemoBrain-v0.2.2-DifyPatch.zip.b64.part3 \
            | tr -d '\r\n' \
            | base64 -d \
            > dify/MemoBrain-v0.2.2-DifyPatch.zip
          unzip -t dify/MemoBrain-v0.2.2-DifyPatch.zip

      - name: Extract Dify package
        run: unzip -o dify/MemoBrain-v0.2.2-DifyPatch.zip -d dify

      - name: Sanitize project-specific defaults
        run: |
          sed -i \
            's#https://api-dify\.automationse\.net/v1#https://your-dify-api.example.com/v1#g' \
            dify/MemoBrain_DifyOnly_v0.2.2.yml

          if grep -R -n -E 'api-dify\.automationse\.net|dify\.automationse\.net' \
              dify/MemoBrain_DifyOnly_v0.2.2.yml; then
            echo 'Production-specific Dify URL detected after sanitization.' >&2
            exit 1
          fi

      - name: Repack sanitized public Dify package
        run: |
          rm -f dify/MemoBrain-v0.2.2-DifyPatch.zip
          cd dify
          zip -X -9 MemoBrain-v0.2.2-DifyPatch.zip \
            MemoBrain_DifyOnly_v0.2.2.yml \
            MemoBrain-v0.2.2-README.txt
          unzip -t MemoBrain-v0.2.2-DifyPatch.zip

      - name: Commit sanitized package and extracted DSL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            dify/MemoBrain-v0.2.2-DifyPatch.zip \
            dify/MemoBrain_DifyOnly_v0.2.2.yml \
            dify/MemoBrain-v0.2.2-README.txt
          if git diff --cached --quiet; then
            echo "No Dify changes."
          else
            git commit -m "chore: publish sanitized Dify workflow sources"
            git push
          fi
