<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>MemoBrain Tips</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    main { padding: 8px 12px; }
    .tip { margin: 0 0 8px; font-size: 13px; line-height: 1.5; }
    .ad-label { margin: 0 0 4px; font-size: 11px; opacity: .65; text-align: center; }
    .ad-wrap { min-height: 96px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .ad-placeholder { width: 100%; min-height: 96px; display: flex; align-items: center; justify-content: center; padding: 10px; border: 1px dashed rgba(127,127,127,.5); border-radius: 8px; font-size: 12px; text-align: center; opacity: .7; }
  </style>
  <script src="./config.js"></script>
</head>
<body>
<main>
  <p class="tip"><strong>MemoBrain Tips:</strong> 元URL、保存時期、補足メモを含めて質問すると、目的の情報を絞り込みやすくなります。</p>
  <section id="ad-section" hidden>
    <p class="ad-label">スポンサーリンク</p>
    <div class="ad-wrap">
      <div id="ad-placeholder" class="ad-placeholder" hidden>AdSense広告はここに表示されます（テスト用）</div>
      <ins id="adsense-slot" class="adsbygoogle" style="display:block;width:100%" data-ad-format="auto" data-full-width-responsive="true" hidden></ins>
    </div>
  </section>
</main>
<script>
(() => {
  const cfg = window.MEMOBRAIN_AD_CONFIG || {};
  const client = typeof cfg.adsenseClient === 'string' ? cfg.adsenseClient.trim() : '';
  const slot = typeof cfg.adsenseSlot === 'string' ? cfg.adsenseSlot.trim() : '';
  const section = document.getElementById('ad-section');
  const placeholder = document.getElementById('ad-placeholder');
  const ad = document.getElementById('adsense-slot');

  if (client && slot) {
    section.hidden = false;
    ad.hidden = false;
    ad.dataset.adClient = client;
    ad.dataset.adSlot = slot;
    const script = document.createElement('script');
    script.async = true;
    script.crossOrigin = 'anonymous';
    script.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + encodeURIComponent(client);
    document.head.appendChild(script);
    script.addEventListener('load', () => {
      try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch (_) {}
    });
  } else if (cfg.showAdPlaceholder === true) {
    section.hidden = false;
    placeholder.hidden = false;
  }
})();
</script>
</body>
</html>
