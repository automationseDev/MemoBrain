<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>MemoBrain AI Chat</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    main { max-width: 960px; margin: 0 auto; padding: 16px; }
    section { margin-bottom: 16px; }
    .guide { line-height: 1.7; }
    .ad-wrap { min-height: 1px; margin: 16px 0; text-align: center; }
    .chat-frame { width: 100%; min-height: 68vh; border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); border-radius: 12px; background: Canvas; }
    .error { padding: 12px; border: 1px solid #b00020; border-radius: 8px; }
  </style>
  <script src="./config.js"></script>
</head>
<body>
<main>
  <section class="guide">
    <h1>MemoBrain</h1>
    <p>保存した情報をDify経由で確認・検索するためのAIチャット画面です。</p>
    <p>AdSenseを有効にする場合は、この部分を実際の利用者に役立つ独自コンテンツへ置き換え、広告だけを目的としたページにしないでください。</p>
    <div id="ad-wrap" class="ad-wrap" hidden>
      <ins id="adsense-slot" class="adsbygoogle" style="display:block" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>
  </section>

  <section>
    <h2>AIチャット</h2>
    <div id="config-error" class="error" hidden>config.js に Dify Web App URL を設定してください。</div>
    <iframe
      id="dify-chat"
      class="chat-frame"
      title="Dify AI Chat"
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="microphone; clipboard-read; clipboard-write">
    </iframe>
  </section>
</main>

<script>
(() => {
  const cfg = window.MEMOBRAIN_CHAT_CONFIG || {};
  const frame = document.getElementById('dify-chat');
  const error = document.getElementById('config-error');

  if (typeof cfg.difyWebAppUrl === 'string' && /^https:\/\//i.test(cfg.difyWebAppUrl)) {
    frame.src = cfg.difyWebAppUrl;
  } else {
    frame.hidden = true;
    error.hidden = false;
  }

  const client = typeof cfg.adsenseClient === 'string' ? cfg.adsenseClient.trim() : '';
  const slot = typeof cfg.adsenseSlot === 'string' ? cfg.adsenseSlot.trim() : '';
  if (client && slot) {
    const script = document.createElement('script');
    script.async = true;
    script.crossOrigin = 'anonymous';
    script.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + encodeURIComponent(client);
    document.head.appendChild(script);

    const ad = document.getElementById('adsense-slot');
    ad.setAttribute('data-ad-client', client);
    ad.setAttribute('data-ad-slot', slot);
    document.getElementById('ad-wrap').hidden = false;

    script.addEventListener('load', () => {
      try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch (_) {}
    });
  }
})();
</script>
</body>
</html>
