<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>MemoBrain AI Chat</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    main { max-width: 960px; margin: 0 auto; padding: 16px; }
    .card {
      margin-bottom: 16px;
      padding: 16px;
      border: 1px solid rgba(127, 127, 127, .28);
      border-radius: 14px;
      background: Canvas;
    }
    h1, h2 { margin-top: 0; }
    .guide { line-height: 1.7; }
    .tips { margin: 12px 0 0; padding-left: 1.25rem; line-height: 1.65; }
    .ad-section { margin-bottom: 16px; }
    .ad-label {
      margin: 0 0 6px;
      font-size: 12px;
      opacity: .65;
      text-align: center;
    }
    .ad-wrap {
      min-height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 10px;
    }
    .ad-placeholder {
      width: 100%;
      min-height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      border: 1px dashed rgba(127, 127, 127, .5);
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      opacity: .7;
    }
    .chat-card { padding: 12px; }
    .chat-frame {
      width: 100%;
      min-height: 70vh;
      border: 0;
      border-radius: 10px;
      background: Canvas;
    }
    .error {
      padding: 12px;
      border: 1px solid #b00020;
      border-radius: 8px;
    }
  </style>
  <script src="./config.js"></script>
</head>
<body>
<main>
  <section class="card guide">
    <h1>MemoBrain</h1>
    <p>保存した情報をDify経由で確認・検索するためのAIチャット画面です。</p>
    <ul class="tips">
      <li>保存したURLやメモの要点を質問できます。</li>
      <li>回答が曖昧な場合は、元URLや保存時の補足メモを指定すると絞り込みやすくなります。</li>
      <li>重要な判断に使う情報は、AI回答だけでなく元ソースも確認してください。</li>
    </ul>
  </section>

  <aside id="ad-section" class="ad-section" hidden>
    <div class="ad-label">スポンサーリンク</div>
    <div class="ad-wrap">
      <div id="ad-placeholder" class="ad-placeholder" hidden>
        AdSense広告はここに表示されます（テスト用プレースホルダー）
      </div>
      <ins id="adsense-slot"
           class="adsbygoogle"
           style="display:block;width:100%"
           data-ad-format="auto"
           data-full-width-responsive="true"
           hidden></ins>
    </div>
  </aside>

  <section class="card chat-card">
    <h2>AIチャット</h2>
    <div id="config-error" class="error" hidden>config.js に Dify Web App URL を設定してください。</div>
    <iframe
      id="dify-chat"
      class="chat-frame"
      title="Dify AI Chat"
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="microphone; clipboard-read; clipboard-write">
    </iframe>
  </section>
</main>

<script>
(() => {
  const cfg = window.MEMOBRAIN_CHAT_CONFIG || {};
  const frame = document.getElementById('dify-chat');
  const error = document.getElementById('config-error');

  if (typeof cfg.difyWebAppUrl === 'string' && /^https:\/\//i.test(cfg.difyWebAppUrl)) {
    frame.src = cfg.difyWebAppUrl;
  } else {
    frame.hidden = true;
    error.hidden = false;
  }

  const client = typeof cfg.adsenseClient === 'string' ? cfg.adsenseClient.trim() : '';
  const slot = typeof cfg.adsenseSlot === 'string' ? cfg.adsenseSlot.trim() : '';
  const showPlaceholder = cfg.showAdPlaceholder === true;
  const adSection = document.getElementById('ad-section');
  const placeholder = document.getElementById('ad-placeholder');
  const ad = document.getElementById('adsense-slot');

  if (client && slot) {
    adSection.hidden = false;
    ad.hidden = false;
    ad.setAttribute('data-ad-client', client);
    ad.setAttribute('data-ad-slot', slot);

    const script = document.createElement('script');
    script.async = true;
    script.crossOrigin = 'anonymous';
    script.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + encodeURIComponent(client);
    document.head.appendChild(script);
    script.addEventListener('load', () => {
      try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch (_) {}
    });
  } else if (showPlaceholder) {
    adSection.hidden = false;
    placeholder.hidden = false;
  }
})();
</script>
</body>
</html>
