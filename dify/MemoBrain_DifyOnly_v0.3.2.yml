app:
  description: 'MemoBrain v0.3.2: Gemini 3.6 Flashから3.5 Flash、2.5 Flashへ自動切替。Knowledge不足時のWeb検索・記事生成・Knowledge自動登録に対応。'
  icon: 🧠
  icon_background: '#E4FBCC'
  icon_type: emoji
  mode: advanced-chat
  name: MemoBrain - Agent v0.3.2
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables:
  - description: MemoBrain Knowledge ID cache
    id: 8f372b43-f001-42da-8f30-1ab3de83f001
    name: dataset_id
    selector:
    - conversation
    - dataset_id
    value: ''
    value_type: string
  environment_variables:
  - description: Dify API base URL
    id: 8f372b43-f002-42da-8f30-1ab3de83f002
    name: DIFY_API_BASE
    selector:
    - env
    - DIFY_API_BASE
    value: https://your-dify-api.example.com/v1
    value_type: string
  - description: Knowledge Service API key (set after import)
    id: 8f372b43-f003-42da-8f30-1ab3de83f003
    name: KNOWLEDGE_API_KEY
    selector:
    - env
    - KNOWLEDGE_API_KEY
    value: ''
    value_type: string
  - description: Knowledge base name
    id: 8f372b43-f004-42da-8f30-1ab3de83f004
    name: DATASET_NAME
    selector:
    - env
    - DATASET_NAME
    value: MemoBrain
    value_type: string
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      - .PDF
      - .TXT
      - .MD
      - .DOC
      - .DOCX
      - .XLS
      - .XLSX
      - .PPT
      - .PPTX
      - .CSV
      - .MP4
      - .MOV
      - .WEBM
      - .M4V
      allowed_file_types:
      - image
      - document
      - video
      - audio
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: true
        number_limits: 10
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 10
    opening_statement: '🧠 **MemoBrain v0.3 Agent**


      文章はそのまま入力できます。Androidの共有先に MemoBrain Share を選ぶと、スクショ・写真・PDF・YouTube・Webページ・動画フレームを自動解析して保存します。


      例：

      - `来週NASのバックアップ設定を確認する`

      - `Difyについて前に何をメモした？`

      - `最近のメモを見せて`'
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 最近のメモを見せて
    - 使い方を教えて
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
