        prompt_template:
        - id: pi1
          role: system
          text: "あなたは個人用メモアプリ MemoBrain の意図解析器です。\nユーザー入力を必ずJSONオブジェクト1個だけで返してください。Markdownや説明は禁止です。\naction は add, search, list, delete, complete, update, favorite, help のいずれか。\n普通のメモ/アイデア/URL/買い物/TODOを残す→add、過去メモを探す/質問→search、最近のメモ/一般的な一覧→list、\n保存した動画一覧/YouTube一覧/動画URL一覧/動画を見せて→search（queryには「youtube 動画 URL」とユーザー指定の検索語を含める）、\n削除→delete、TODO完了→complete、追記/修正→update、お気に入り登録/解除→favorite、使い方→help。迷ったらadd。\nJSON:\n{\"action\":\"add\",\"title\":\"短い日本語タイトル\",\"content\":\"保存する元内容\",\"query\":\"検索用語\",\"target\":\"対象メモ特定語\",\n\"memo_type\":\"memo|todo|idea|url|shopping|tech|work|schedule\",\"category\":\"短いカテゴリ\",\"tags\":\"カンマ区切り最大5個\",\n\"due_date\":\"明示期限または空文字\",\"update_instruction\":\"更新等の具体的指示または空文字\"}\naddでは情報を落とさずcontentに保持し、title/category/tagsを生成する。管理操作ではtargetを具体化する。\n追加で source_type=text, source_url=\"\", summary, key_points, todo も出力してください。\n必ずJSONオブジェクト1個だけ返してください。Markdownは禁止。\n{\n \"action\":\"add\",\n \"title\":\"短い日本語タイトル\",\n \"content\":\"保存する詳細内容\",\n \"query\":\"\",\n \"\
            target\":\"\",\n \"memo_type\":\"memo|todo|idea|url|shopping|tech|work|schedule\",\n \"category\":\"短いカテゴリ\",\n \"tags\":\"カンマ区切り最大5個\",\n \"due_date\":\"期限または空文字\",\n \"update_instruction\":\"\",\n \"source_type\":\"text|image|video|youtube|web|document\",\n \"source_url\":\"元URLまたは空文字\",\n \"summary\":\"2〜5行の要約\",\n \"key_points\":\"重要点を箇条書き文字列\",\n \"todo\":\"内容から明確に発生するTODO。なければ空文字\"\n}"
        - id: pi2
          role: user
          text: '{{#sys.query#}}'
        selected: false
        title: 意図解析 [3.6 Flash]
        type: llm
        variables: []
        vision:
          enabled: false
        error_strategy: fail-branch
      height: 120
      id: intent_llm
      position:
        x: 600
        y: 220
      positionAbsolute:
        x: 600
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        code: "import json\nimport re\nfrom datetime import datetime, timezone, timedelta\n\ndef _json(s):\n    s = (s or \"\").strip()\n    s = re.sub(r\"^```(?:json)?\\s*\", \"\", s, flags=re.I)\n    s = re.sub(r\"\\s*```$\", \"\", s)\n    try:\n        return json.loads(s)\n    except Exception:\n        m = re.search(r\"\\{.*\\}\", s, re.S)\n        if m:\n            try:\n                return json.loads(m.group(0))\n            except Exception:\n                pass\n    return {}\n\ndef main(raw: str, user_query: str) -> dict:\n    d = _json(raw)\n    a = str(d.get(\"action\") or \"add\").lower().strip()\n    allowed = {\"add\", \"search\", \"list\", \"delete\", \"complete\", \"update\", \"favorite\", \"help\"}\n    if a not in allowed:\n        a = \"add\"\n    q = user_query or \"\"\n    url_match = re.search(r\"https?://[^\\s<>]+\", q)\n    fallback_url = url_match.group(0).rstrip(\".,);]}>\\\"'\") if url_match else \"\"\n    now = datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=9))).strftime(\"\
          %Y-%m-%d %H:%M:%S\")\n    return {\n        \"action\": a,\n        \"title\": str(d.get(\"title\") or q[:36] or \"メモ\"),\n        \"content\": str(d.get(\"content\") or d.get(\"summary\") or q),\n        \"query\": str(d.get(\"query\") or q),\n        \"target\": str(d.get(\"target\") or d.get(\"query\") or q),\n        \"memo_type\": str(d.get(\"memo_type\") or \"memo\"),\n        \"category\": str(d.get(\"category\") or \"未分類\"),\n        \"tags\": str(d.get(\"tags\") or \"\"),\n        \"due_date\": str(d.get(\"due_date\") or \"\"),\n        \"instruction\": str(d.get(\"update_instruction\") or \"\"),\n        \"now_jst\": now,\n        \"source_type\": str(d.get(\"source_type\") or \"text\"),\n        \"source_url\": str(d.get(\"source_url\") or fallback_url or \"\"),\n        \"summary\": str(d.get(\"summary\") or \"\"),\n        \"key_points\": str(d.get(\"key_points\") or \"\"),\n        \"todo\": str(d.get(\"todo\") or \"\"),\n    }\n"
