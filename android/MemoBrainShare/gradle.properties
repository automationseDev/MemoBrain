# MemoBrain v0.4.1
#
# AdMob production IDs are intentionally NOT stored in this file.
# Debug builds automatically use Google's official test IDs.
# Release builds require local build-time values from one of:
#   1. release-secrets.properties (recommended; gitignored)
#   2. -PMEMOBRAIN_ADMOB_APP_ID / -PMEMOBRAIN_ADMOB_BANNER_ID
#   3. environment variables with the same names
#
# Copy release-secrets.properties.example to release-secrets.properties
# and put your own AdMob IDs there before building a release.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true

# Java source/target is 17. The JVM that launches Gradle is selected by
# Android Studio via .idea/gradle.xml using GRADLE_LOCAL_JAVA_HOME.
